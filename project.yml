name: Filaire
options:
  bundleIdPrefix: ${BUNDLE_ID}
  xcodeVersion: "16.0"
  deploymentTarget:
    iOS: "17.0"

packages:
  SwiftTerm:
    url: https://github.com/migueldeicaza/SwiftTerm.git
    from: 1.20.0
  Citadel:
    url: https://github.com/orlandos-nl/Citadel.git
    from: 0.12.1

targets:
  Filaire:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Filaire
        excludes:
          - "Info.plist"
    dependencies:
      - package: SwiftTerm
        product: SwiftTerm
      - package: Citadel
        product: Citadel
    info:
      path: Filaire/Info.plist
      properties:
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        GitCommit: "$(GIT_COMMIT)"
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
          UISceneConfigurations: {}
    settings:
      base:
        PRODUCT_NAME: Filaire
        PRODUCT_BUNDLE_IDENTIFIER: ${BUNDLE_ID}
        DEVELOPMENT_TEAM: ${DEVELOPMENT_TEAM}
        MARKETING_VERSION: "1.0.2"
        CURRENT_PROJECT_VERSION: "${CURRENT_PROJECT_VERSION}"
        GIT_COMMIT: "${GIT_COMMIT}"
        SWIFT_VERSION: "5.10"
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: "Filaire"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UIRequiresFullScreen: NO
        INFOPLIST_KEY_UIApplicationSupportsMultipleScenes: YES
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_NSFaceIDUsageDescription: "Filaire uses Face ID to securely authenticate and access your SSH keys and credentials in the Secure Enclave."
        ENABLE_BITCODE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_UIAppFonts:
          - MesloLGSNerdFont-Regular.ttf

  FilaireTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: FilaireTests
    dependencies:
      - target: Filaire
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
